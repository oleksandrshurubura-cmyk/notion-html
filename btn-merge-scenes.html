<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 10px 20px; border-radius: 4px; border: none;
    background: #67c23a; color: white; font-size: 14px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(103,194,58,0.3);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .progress { display: none; margin-top: 10px; width: 240px; }
  .bar-bg { background: #e9e9eb; border-radius: 4px; height: 8px; overflow: hidden; }
  .bar { height: 100%; background: #67c23a; border-radius: 4px; width: 0%; transition: width 0.15s linear; }
  .status { font-size: 12px; color: #606266; margin-top: 5px; }
  .result { display: none; margin-top: 8px; font-size: 13px; color: #67c23a; font-weight: 500; animation: pop 0.3s ease; }
  @keyframes pop { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
</style>
</head>
<body>
  <button class="btn" id="btn" onclick="merge()">▶ Merge Scenes</button>
  <div class="progress" id="prog">
    <div class="bar-bg"><div class="bar" id="bar"></div></div>
    <div class="status" id="status">Завантажуємо файли...</div>
  </div>
  <div class="result" id="result">🎉 Готово! Фінальне відео зібране.</div>
  <script>
    let running = false;
    const stages = [
      { pct: 15, msg: '⬆️ Завантажуємо сцени на сервер...' },
      { pct: 35, msg: '🎵 Накладаємо фонову музику...' },
      { pct: 60, msg: '💬 Генеруємо субтитри...' },
      { pct: 80, msg: '🎬 З\'єднуємо сцени по порядку...' },
      { pct: 95, msg: '✂️ Додаємо CTA кінцівку...' },
      { pct: 100, msg: '✅ Фінальне відео готове!' },
    ];
    function merge() {
      if (running) return;
      running = true;
      document.getElementById('btn').textContent = '⏳ Merging...';
      document.getElementById('prog').style.display = 'block';
      document.getElementById('result').style.display = 'none';
      let i = 0;
      const tick = setInterval(() => {
        if (i >= stages.length) { clearInterval(tick); return; }
        const s = stages[i++];
        document.getElementById('bar').style.width = s.pct + '%';
        document.getElementById('status').textContent = s.msg;
        if (s.pct === 100) {
          setTimeout(() => {
            document.getElementById('prog').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('btn').innerHTML = '▶ Merge Scenes';
            running = false;
          }, 800);
        }
      }, 700);
    }
  </script>
</body>
</html>
