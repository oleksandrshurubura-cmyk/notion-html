<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 16px; border-radius: 4px;
    border: 1px solid #409eff;
    background: white; color: #409eff;
    font-size: 13px; cursor: default;
  }
  .count { opacity: 0.85; }
</style>
</head>
<body>
  <button class="btn">Generate selected <span class="count">(2)</span></button>
</body>
</html>
