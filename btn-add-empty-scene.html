<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .wrap { display: inline-flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; border-radius: 4px; border: none;
    background: #909399; color: white; font-size: 14px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(144,147,153,0.3);
    transition: transform 0.1s;
  }
  .btn:active { transform: scale(0.97); }
  .scenes { display: flex; gap: 8px; flex-wrap: wrap; }
  .scene {
    width: 48px; height: 64px; background: #f0f2f5; border: 2px dashed #dcdfe6;
    border-radius: 4px; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: #909399; flex-direction: column; gap: 2px;
    animation: pop 0.2s ease;
  }
  @keyframes pop { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .scene-num { font-size: 10px; font-weight: 600; color: #c0c4cc; }
</style>
</head>
<body>
  <div class="wrap">
    <button class="btn" onclick="addScene()">+ Add Empty Scene</button>
    <div class="scenes" id="scenes"></div>
  </div>
  <script>
    let count = 0;
    function addScene() {
      count++;
      const s = document.createElement('div');
      s.className = 'scene';
      s.innerHTML = `<span>🎬</span><span class="scene-num">#${count}</span>`;
      document.getElementById('scenes').appendChild(s);
    }
  </script>
</body>
</html>
