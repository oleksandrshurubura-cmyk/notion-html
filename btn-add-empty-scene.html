<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 10px 20px; border-radius: 4px; border: none;
    background: #909399; color: white;
    font-size: 14px; cursor: default;
    box-shadow: 0 1px 3px rgba(144,147,153,0.3);
  }
  .icon { font-size: 16px; line-height: 1; }
</style>
</head>
<body>
  <button class="btn"><span class="icon">+</span> Add Empty Scene</button>
</body>
</html>
