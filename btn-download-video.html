<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center;
    padding: 6px 12px; border-radius: 4px; border: none;
    background: #67c23a; color: white;
    font-size: 12px; cursor: default;
    box-shadow: 0 1px 3px rgba(103,194,58,0.3);
  }
</style>
</head>
<body>
  <button class="btn">Download Video</button>
</body>
</html>
