<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 8px 16px; border-radius: 4px; border: none;
    background: #409eff; color: white;
    font-size: 13px; cursor: default;
    box-shadow: 0 1px 3px rgba(64,158,255,0.3);
  }
  .count { opacity: 0.85; }
</style>
</head>
<body>
  <button class="btn">Generate all <span class="count">(4)</span></button>
</body>
</html>
