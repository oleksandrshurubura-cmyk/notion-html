<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center;
    padding: 10px 20px; border-radius: 4px;
    border: 1px solid #dcdfe6; background: white; color: #606266;
    font-size: 14px; cursor: pointer;
    transition: transform 0.1s, border-color 0.15s, color 0.15s;
  }
  .btn:hover { border-color: #f56c6c; color: #f56c6c; }
  .btn:active { transform: scale(0.97); }
  .msg { display: none; margin-top: 8px; font-size: 12px; color: #606266; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <button class="btn" onclick="reset()">Reset</button>
  <div class="msg" id="msg"></div>
  <script>
    function reset() {
      const msg = document.getElementById('msg');
      msg.style.display = 'block';
      msg.textContent = '💥 Всі сцени видалено. Починаємо з чистого листа.';
      clearTimeout(window._t);
      window._t = setTimeout(() => msg.style.display = 'none', 2500);
    }
  </script>
</body>
</html>
