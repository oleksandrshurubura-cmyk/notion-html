<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .group { display: inline-flex; border: 1px solid #dcdfe6; border-radius: 4px; overflow: hidden; }
  .item {
    padding: 8px 15px; font-size: 13px; cursor: pointer;
    border-right: 1px solid #dcdfe6; color: #606266; background: white;
    transition: background 0.15s, color 0.15s;
  }
  .item:last-child { border-right: none; }
  .item.active { background: #409eff; color: white; border-color: #409eff; }
  .hint { margin-top: 8px; font-size: 12px; color: #909399; display: none; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <div class="group">
    <div class="item active" onclick="select(this, 'TikTok, Reels, Stories — вертикальний 9:16 🎵')">Portrait (9:16)</div>
    <div class="item" onclick="select(this, 'YouTube, десктоп — горизонтальний 16:9 🖥️')">Landscape (16:9)</div>
    <div class="item" onclick="select(this, 'Instagram feed, Facebook — квадратний 1:1 🟫')">Square (1:1)</div>
  </div>
  <div class="hint" id="hint"></div>
  <script>
    function select(el, msg) {
      document.querySelectorAll('.item').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
      const h = document.getElementById('hint');
      h.textContent = msg;
      h.style.display = 'block';
    }
  </script>
</body>
</html>
