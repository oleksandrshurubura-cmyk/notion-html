<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 4px; border: none;
    background: #909399; color: white; font-size: 13px; cursor: pointer;
    transition: transform 0.1s, background 0.2s;
  }
  .btn:active { transform: scale(0.97); }
  .btn.saved { background: #67c23a; }
  .msg { display: none; margin-top: 6px; font-size: 12px; color: #67c23a; animation: fadein 0.2s ease; }
  @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
</style>
</head>
<body>
  <button class="btn" id="btn" onclick="backup()">💾 Backup Scenes</button>
  <div class="msg" id="msg"></div>
  <script>
    let count = 0;
    function backup() {
      count++;
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      btn.classList.add('saved');
      btn.textContent = '✅ Збережено!';
      msg.style.display = 'block';
      msg.textContent = `Резервна копія #${count} збережена в браузері. Сцени відновляться при наступному відкритті.`;
      setTimeout(() => {
        btn.classList.remove('saved');
        btn.textContent = '💾 Backup Scenes';
      }, 2000);
    }
  </script>
</body>
</html>
