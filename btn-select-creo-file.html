<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 8px 16px; border-radius: 4px; border: none;
    background: #409eff; color: white; font-size: 14px; cursor: pointer;
    box-shadow: 0 1px 3px rgba(64,158,255,0.3);
    transition: transform 0.1s, box-shadow 0.1s;
    position: relative; overflow: hidden;
  }
  .btn:active { transform: scale(0.97); }
  .toast {
    display: none; position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #303133; color: white; padding: 10px 18px; border-radius: 6px;
    font-size: 13px; white-space: nowrap; z-index: 99;
    animation: fadein 0.2s ease;
  }
  @keyframes fadein { from { opacity: 0; transform: translateX(-50%) translateY(8px); } to { opacity: 1; transform: translateX(-50%) translateY(0); } }
</style>
</head>
<body>
  <button class="btn" onclick="showToast()">📎 Select Creo File</button>
  <div class="toast" id="toast">📂 Відкривається вікно вибору файлу — обери відео з комп'ютера</div>
  <script>
    function showToast() {
      const t = document.getElementById('toast');
      t.style.display = 'block';
      clearTimeout(window._t);
      window._t = setTimeout(() => t.style.display = 'none', 2500);
    }
  </script>
</body>
</html>
