<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; padding: 6px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .tag {
    display: inline-block; padding: 3px 9px; border-radius: 3px;
    font-size: 12px; font-weight: 500; border: 1px solid; cursor: pointer;
    transition: transform 0.1s, box-shadow 0.1s;
  }
  .tag:hover { transform: translateY(-1px); box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  .tag:active { transform: scale(0.95); }
  .created  { background: #f4f4f5; color: #909399; border-color: #e9e9eb; }
  .queued   { background: #fdf6ec; color: #e6a23c; border-color: #f5dab1; }
  .success  { background: #f0f9eb; color: #67c23a; border-color: #b3e19d; }
  .error    { background: #fef0f0; color: #f56c6c; border-color: #fbc4c4; }
  .hint { display: none; margin-top: 8px; font-size: 12px; color: #606266; animation: fadein 0.2s; }
  @keyframes fadein { from { opacity:0; } to { opacity:1; } }
</style>
</head>
<body>
  <div class="row">
    <span class="tag created" onclick="show('⏳ CREATED — задача щойно створена, ще не почалась обробка')">CREATED</span>
    <span class="tag queued" onclick="show('🔄 QUEUED — задача в черзі, ШІ зараз обробляє')">QUEUED</span>
    <span class="tag success" onclick="show('✅ SUCCESS — задача виконана, результат готовий')">SUCCESS</span>
    <span class="tag error" onclick="show('❌ ERROR — щось пішло не так, деталі в Task Details')">ERROR</span>
  </div>
  <div class="hint" id="hint"></div>
  <script>
    function show(msg) {
      const h = document.getElementById('hint');
      h.textContent = msg;
      h.style.display = 'block';
    }
  </script>
</body>
</html>
